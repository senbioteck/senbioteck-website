version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senbioteck-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://senbioteck:senbioteck_secret@postgres:5432/senbioteck?schema=public
      - ENCRYPTION_KEY=dev-encryption-key-change-in-production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - senbioteck-network
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: senbioteck-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=senbioteck
      - POSTGRES_USER=senbioteck
      - POSTGRES_PASSWORD=senbioteck_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - senbioteck-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senbioteck -d senbioteck"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: senbioteck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - senbioteck-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: senbioteck-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - senbioteck-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/uploads --ignore-existing;
      /usr/bin/mc anonymous set public myminio/uploads;
      exit 0;
      "

networks:
  senbioteck-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
